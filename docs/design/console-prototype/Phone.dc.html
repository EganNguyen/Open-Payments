<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open Payments Console on iPhone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; font-family: 'IBM Plex Sans', sans-serif;">
<dc-import name="Main" layout="phone" role="{{role}}" theme="{{theme}}" action-result="{{actionResult}}" search-status="{{searchStatus}}" replica-behind="{{replicaBehind}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["Viewer","Operator","Approver","Admin"],"default":"Approver"},"theme":{"editor":"enum","options":["Light","Dark","Device"],"default":"Light"},"actionResult":{"editor":"enum","options":["Done","Still checking","State changed","Busy"],"default":"Done"},"searchStatus":{"editor":"enum","options":["Normal","Unavailable","Timed out"],"default":"Normal"},"replicaBehind":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { role: this.props.role ?? 'Approver', theme: this.props.theme ?? 'Light', actionResult: this.props.actionResult ?? 'Done', searchStatus: this.props.searchStatus ?? 'Normal', replicaBehind: Boolean(this.props.replicaBehind) };
  }
}
</script>
</body>
</html>
