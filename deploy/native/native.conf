# Native macOS settings, added after primary.macbook.conf.
listen_addresses = '127.0.0.1'

# On macOS only F_FULLFSYNC reaches stable storage. Plain fsync returns once the
# drive has the data in its volatile cache (18 µs against 3,263 µs when measured).
fsync = on
full_page_writes = on
wal_sync_method = fsync_writethrough
