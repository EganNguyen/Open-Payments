# Two API instances behind nginx, for ramp step 6's scaling purpose (D56):
#   docker compose -f deploy/compose/compose.yaml -f deploy/compose/two-api.yaml up -d --wait
# Clients use 127.0.0.1:8080 (nginx). Prometheus scrapes each instance on 8081 and 8082.
services:
  api:
    ports: !override
      - "127.0.0.1:8081:8080"

  api2:
    build:
      context: ../..
      dockerfile: deploy/compose/api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      DATABASE_URL: postgres://op_app:op_local_only@pgbouncer:6432/openpayments
      PSP_URL: http://mock-psp:8080
      INFLIGHT_CAP: "500"
    depends_on:
      pgbouncer:
        condition: service_healthy
      mock-psp:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8080"

  lb:
    image: nginx:1.27.3-alpine
    volumes:
      - ./lb/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - api2
    ports:
      - "127.0.0.1:8080:8080"
