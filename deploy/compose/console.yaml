# The staff console beside the local stack:
#   docker compose -f deploy/compose/compose.yaml -f deploy/compose/console.yaml up -d --wait
# Reads come from standby1, writes and reads after an action from the primary, and money moves
# only through the API. Keycloak is a pinned local identity provider; its admin user must set up
# TOTP at first sign-in; its level-of-authentication flow reports MFA as acr "mfa" (D55).
# Local values only.
# Apply migrations first, as for the rest of the stack: scripts/migrate.sh.
services:
  console-init:
    image: postgres:18.6
    depends_on:
      primary:
        condition: service_healthy
    environment:
      PGPASSWORD: op_local_only
    volumes:
      - ./console/init.sql:/init.sql:ro
    entrypoint: ["psql", "-h", "primary", "-U", "postgres", "-d", "openpayments", "-v", "ON_ERROR_STOP=1", "-f", "/init.sql"]
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm", "--http-port=8180", "--hostname=http://localhost:8180", "--hostname-backchannel-dynamic=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: kcadmin
      KC_BOOTSTRAP_ADMIN_PASSWORD: op_local_only
    volumes:
      - ./console/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "127.0.0.1:8180:8180"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8180 && printf 'GET /realms/open-payments/.well-known/openid-configuration HTTP/1.0\\r\\nHost: localhost:8180\\r\\n\\r\\n' >&3 && grep -q issuer <&3"]
      interval: 5s
      timeout: 5s
      retries: 60

  console:
    build:
      context: ../..
      dockerfile: deploy/compose/console/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8090
      ASPNETCORE_ENVIRONMENT: Development
      Console__Db__Primary: Host=primary;Database=openpayments;Username=console_write;Password=op_local_only
      Console__Db__PrimaryRead: Host=primary;Database=openpayments;Username=console_read;Password=op_local_only
      Console__Db__Replica: Host=standby1;Database=openpayments;Username=console_read;Password=op_local_only
      Console__Oidc__Authority: http://localhost:8180/realms/open-payments
      Console__Oidc__MetadataAddress: http://keycloak:8180/realms/open-payments/.well-known/openid-configuration
      Console__Oidc__ClientId: op-console
      Console__Oidc__ClientSecret: op_local_only
      Console__Oidc__RequiredAmr: otp
      # D55: Keycloak reports the TOTP step as acr "mfa" (level 2), not in amr.
      Console__Oidc__RequiredAcr: mfa
      Console__Api__BaseUrl: http://api:8080/
      Console__Api__ResolutionKey: console-resolve-local
      # Throughput and reliability panels. Empty or unreachable leaves those panels unavailable;
      # lifecycle and correctness still read from the replica.
      Console__Metrics__PrometheusUrl: http://prometheus:9090
      Console__Api__Keys__11111111-1111-7111-8111-111111111111: benchmark-token
      Console__Merchants__0: 11111111-1111-7111-8111-111111111111
      Console__DataProtection__Path: /keys
    volumes:
      - console-keys:/keys
    depends_on:
      console-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      api:
        condition: service_started
      standby1:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      # The aspnet image's sh is dash, which has no /dev/tcp, so run bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8090 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost:8090\\r\\n\\r\\n' >&3 && grep -q ok <&3"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  console-keys:
