[databases]
openpayments = host=primary port=5432 dbname=openpayments

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres

; Transaction pooling with a fixed pool, the starting point in the engineering standards
pool_mode = transaction
default_pool_size = 100
max_client_conn = 10000
max_prepared_statements = 200

; A short wait turns exhaustion into a fast failure. query_timeout stays 0 so PgBouncer never
; interrupts a COMMIT waiting for a synchronous standby (D28).
query_wait_timeout = 5
query_timeout = 0
server_login_retry = 1
log_connections = 0
log_disconnections = 0
