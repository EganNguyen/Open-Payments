# Round-robin in front of two API instances, for ramp step 6 (D56). Keep-alive to the upstreams,
# so the proxy doesn't open a connection per request.
events {
  worker_connections 8192;
}

http {
  access_log off;
  upstream api {
    least_conn;
    server api:8080;
    server api2:8080;
    keepalive 256;
  }

  server {
    listen 8080;
    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_read_timeout 30s;
    }
  }
}
