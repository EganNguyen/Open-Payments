global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: pgbouncer
    static_configs:
      - targets: ["pgbouncer-exporter:9127"]

  # The API runs on the host in local development. host-gateway makes this work on Linux
  # as well as Docker Desktop.
  - job_name: api
    static_configs:
      # One target per API instance. 8082 is down unless two-api.yaml runs the second one.
      - targets: ["host.docker.internal:8081", "host.docker.internal:8082"]
