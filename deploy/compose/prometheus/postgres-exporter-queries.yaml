# Custom postgres-exporter queries. The stock collectors expose the current WAL size, not
# bytes written, so expose the LSN offset and let Prometheus take its rate.
pg_wal:
  query: "SELECT pg_wal_lsn_diff(pg_current_wal_lsn(), '0/0')::float8 AS bytes"
  metrics:
    - bytes:
        usage: GAUGE
        description: WAL bytes written since the start of the cluster.

# Payments, attempts and refunds whose outcome isn't established: PSP_PENDING or UNKNOWN
# payments, and PENDING or UNKNOWN attempts and refunds. Stage 1 has no reconciler, so these stay
# until a person resolves them (docs/runbooks/unknown-outcomes.md). One row per kind, state,
# currency and PSP: how many, how old the oldest is, and how much money they hold. The partial
# *_unresolved indexes serve each branch. No rows means nothing is unresolved.
op_unresolved:
  query: |
    select 'payment' as kind, p.state, p.currency::text as currency, '' as psp,
           count(*)::float8 as count,
           extract(epoch from now() - min(p.updated_at))::float8 as oldest_age_seconds,
           sum(p.amount_minor)::float8 as amount_minor
    from payments p
    where p.state in ('PSP_PENDING', 'UNKNOWN')
    group by p.state, p.currency
    union all
    select 'attempt', a.state, p.currency::text, a.psp,
           count(*)::float8,
           extract(epoch from now() - min(a.created_at))::float8,
           sum(case when a.operation in ('authorize', 'sale', 'capture') then p.amount_minor else 0 end)::float8
    from payment_attempts a
    join payments p on p.id = a.payment_id
    where a.state in ('PENDING', 'UNKNOWN')
    group by a.state, p.currency, a.psp
    union all
    select 'refund', r.state, p.currency::text, r.psp,
           count(*)::float8,
           extract(epoch from now() - min(r.created_at))::float8,
           sum(r.amount_minor)::float8
    from refunds r
    join payments p on p.id = r.payment_id
    where r.state in ('PENDING', 'UNKNOWN')
    group by r.state, p.currency, r.psp
  metrics:
    - kind:
        usage: LABEL
        description: payment, attempt or refund.
    - state:
        usage: LABEL
        description: The unresolved state.
    - currency:
        usage: LABEL
        description: The payment's currency.
    - psp:
        usage: LABEL
        description: The PSP for attempts and refunds; empty for payments.
    - count:
        usage: GAUGE
        description: Operations in this state.
    - oldest_age_seconds:
        usage: GAUGE
        description: Age of the oldest one, from its last update (payments) or creation.
    - amount_minor:
        usage: GAUGE
        description: Money they hold, in minor units of the currency.

# D19/D64: how much is waiting for expiry, and how old the oldest expirable row is. A resolved
# key older than retention plus an hour means ExpiryWorker is not keeping up.
op_expiry_backlog:
  query: |
    select 'key' as kind, count(*)::float8 as count,
           coalesce(extract(epoch from now() - min(resolved_at)), 0)::float8 as oldest_age_seconds
    from idempotency_keys
    where resolved_at is not null
    union all
    select 'event' as kind, count(*)::float8,
           coalesce(extract(epoch from now() - min(processed_at)), 0)::float8
    from psp_events
    where processed_at is not null
  metrics:
    - kind:
        usage: LABEL
        description: key or event.
    - count:
        usage: GAUGE
        description: Rows eligible for expiry now.
    - oldest_age_seconds:
        usage: GAUGE
        description: Age of the oldest eligible row.

# D18/C40: settlement inputs that cannot settle the clearing position. A line is unmatched or
# mismatched, or an operation has no line past its settlement lag. These page.
op_settlement_discrepancies:
  query: |
    select 'line' as kind, count(*)::float8 as count
    from settlement_lines
    where state in ('UNMATCHED', 'MISMATCH')
    union all
    select 'missing' as kind, count(*)::float8
    from settlement_missing
    where found_at is null
  metrics:
    - kind:
        usage: LABEL
        description: line or missing.
    - count:
        usage: GAUGE
        description: Open settlement discrepancies.
