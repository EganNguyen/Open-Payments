# E1's commit signals. A commit warning means a payment's outcome is unknown, so it pages at
# once (E1 item 6). An abandoned commit is one still running past the commit wait limit; one that
# lasts a minute means a standby or the network is stuck. Routing to a pager is Stage 5's job;
# here the alerts fire in Prometheus.
groups:
  - name: open-payments-commits
    rules:
      - alert: CommitWarning
        expr: increase(op_commit_warnings_total[1m]) > 0
        labels:
          severity: page
        annotations:
          summary: A commit returned a replication warning; its outcome is unknown (E1, D28).
      - alert: AbandonedCommitsStuck
        expr: op_abandoned_commits > 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: Commits have run past the commit wait limit for a minute (E1).
  - name: open-payments-unresolved
    rules:
      # CK5's threshold. Stage 1 has no reconciler, so an operation this old stays unresolved until a
      # person handles it: docs/runbooks/unknown-outcomes.md.
      - alert: UnresolvedOperationAging
        expr: max by (kind, state) (op_unresolved_oldest_age_seconds) > 60
        for: 1m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.kind }} operations have been {{ $labels.state }} for over 60 s; their outcome isn't established."
  - name: open-payments-escalation
    rules:
      # D45: a 2 h age limit. The exporter reads the same unresolved rows; if one is still
      # UNKNOWN past the limit, escalation is not clearing it.
      - alert: UnresolvedEscalated
        expr: max by (kind) (op_unresolved_oldest_age_seconds{state="UNKNOWN"}) > 7200
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "An UNKNOWN {{ $labels.kind }} is past the 2 h escalation age limit; it should be in REVIEW (D45)."
  - name: open-payments-psp
    rules:
      - alert: PspBreakerOpen
        expr: op_psp_breaker_state > 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "The PSP breaker for {{ $labels.psp }} / {{ $labels.account }} is open; calls fail fast (C13, C51)."
      - alert: PspAccountCredentialRejected
        expr: increase(op_psp_rejected_total{reason="psp_credential_rejected"}[5m]) > 0
        labels:
          severity: page
        annotations:
          summary: "A PSP account's credential was rejected; attempts fail with a stable code (C51)."
      - alert: PspTlsCertExpiring
        expr: op_psp_tls_cert_expiry_seconds < 604800
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: "The PSP's TLS certificate expires within 7 days (C16)."
      - alert: PspDnsFailures
        expr: increase(op_psp_rejected_total{reason="dns_failure"}[5m]) > 0
        labels:
          severity: ticket
        annotations:
          summary: "PSP name resolution is failing (C16)."
  - name: open-payments-events
    rules:
      - alert: PspEventContradiction
        expr: increase(op_psp_events_total{outcome="contradiction"}[5m]) > 0
        labels:
          severity: page
        annotations:
          summary: "A PSP callback contradicted a final payment state (E9, FS-05)."
      - alert: PspEventsParkedTooLong
        expr: op_psp_events_parked_oldest_age_seconds > 900
        for: 1m
        labels:
          severity: ticket
        annotations:
          summary: "A parked PSP event is older than 15 minutes; the operation can't take it (D59)."
