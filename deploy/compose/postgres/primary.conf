# Settings the design requires are grouped first. Sizes are for a local machine.

# Quorum synchronous replication (D7)
synchronous_standby_names = 'ANY 1 (standby1, standby2)'
synchronous_commit = on

# Deadlocks must be detected before lock waits time out (D1)
deadlock_timeout = 100ms
log_lock_waits = on

# Replication. Logical WAL is kept so the spike can measure log-based capture (V9).
wal_level = logical
max_wal_senders = 10
max_replication_slots = 10
hot_standby = on
max_slot_wal_keep_size = 20GB

# WAL and maintenance (D57). These hold on any server, not just this laptop.
# The 16 MB wal_buffers default filled 108,801 times under the D47 mix; 64 MB is a common
# OLTP value. lz4 cuts full-page-image volume that the primary and standbys must write and fsync.
wal_buffers = 64MB
wal_compression = lz4
# Stated, not left to the default: an ALTER SYSTEM had turned it off (D57).
autovacuum = on
# Needed to see fsync and I/O stalls in pg_stat_io.
track_io_timing = on
track_wal_io_timing = on

# Local sizing
listen_addresses = '*'
max_connections = 300
shared_buffers = 3GB
effective_cache_size = 5GB
max_wal_size = 16GB
checkpoint_timeout = 15min
log_min_messages = warning
