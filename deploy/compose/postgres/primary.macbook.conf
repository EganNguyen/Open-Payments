# Sizes for an 18-core, 48 GB MacBook with Docker given 18 CPUs and 40 GB.
# Everything the design requires, including quorum commit, comes from primary.conf unchanged.
include 'primary.conf'

max_connections = 1100
shared_buffers = 10GB
effective_cache_size = 24GB

# The first runs filled the default WAL buffers constantly (wal_buffers_full about 2M).
wal_buffers = 256MB
wal_compression = lz4

# Fewer checkpoints, so fewer full-page images in the WAL.
max_wal_size = 64GB
min_wal_size = 8GB
checkpoint_timeout = 30min
checkpoint_completion_target = 0.9
bgwriter_lru_maxpages = 1000

# Keep up with constant inserts and updates.
autovacuum_max_workers = 6
autovacuum_naptime = 15s
autovacuum_vacuum_cost_limit = 4000

random_page_cost = 1.1
track_io_timing = on
track_wal_io_timing = on
