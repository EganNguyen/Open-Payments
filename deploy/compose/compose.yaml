# Local replicated database stack for the spike and for development.
# Local numbers are comparative only. Ports bind to 127.0.0.1, and the password is
# a local-only development value, never used anywhere else.
name: open-payments

x-postgres: &postgres
  image: postgres:18.6
  stop_grace_period: 30s
  environment: &postgres-env
    POSTGRES_PASSWORD: op_local_only
    REPLICATOR_PASSWORD: op_local_only
    APP_PASSWORD: op_local_only

services:
  primary:
    <<: *postgres
    command: ["postgres", "-c", "config_file=/etc/postgresql/primary.conf"]
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - ./postgres/primary.conf:/etc/postgresql/primary.conf:ro
      - ./postgres/init-primary.sh:/docker-entrypoint-initdb.d/10-init-primary.sh:ro
      - primary-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openpayments"]
      interval: 2s
      timeout: 3s
      retries: 60

  standby1:
    <<: *postgres
    entrypoint: ["/usr/local/bin/start-standby.sh", "standby1"]
    command: []
    depends_on:
      primary:
        condition: service_healthy
    volumes:
      - ./postgres/primary.conf:/etc/postgresql/primary.conf:ro
      - ./postgres/start-standby.sh:/usr/local/bin/start-standby.sh:ro
      - standby1-data:/var/lib/postgresql
    healthcheck: &standby-health
      test: ["CMD-SHELL", "psql -U postgres -XAtc 'select pg_is_in_recovery()' | grep -q t"]
      interval: 2s
      timeout: 3s
      retries: 60

  standby2:
    <<: *postgres
    entrypoint: ["/usr/local/bin/start-standby.sh", "standby2"]
    command: []
    depends_on:
      primary:
        condition: service_healthy
    volumes:
      - ./postgres/primary.conf:/etc/postgresql/primary.conf:ro
      - ./postgres/start-standby.sh:/usr/local/bin/start-standby.sh:ro
      - standby2-data:/var/lib/postgresql
    healthcheck: *standby-health

  pgbouncer:
    build: ./pgbouncer
    depends_on:
      primary:
        condition: service_healthy
    ports:
      - "127.0.0.1:16432:6432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  primary-data:
  standby1-data:
  standby2-data:
